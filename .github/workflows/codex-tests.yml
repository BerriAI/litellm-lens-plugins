name: Codex plugin tests
on:
  push:
    paths: ['codex/**', '.agents/**', '.github/workflows/codex-tests.yml']
  pull_request:
    paths: ['codex/**', '.agents/**', '.github/workflows/codex-tests.yml']
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.11', '3.14']
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: codex
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q lens_codex scripts
